name: Sync upstream content

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com:443/fmhy/edit.git
          git fetch upstream main

      - name: Import upstream Markdown content
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/sync-upstream.mjs upstream/main

      - name: Build and check de-branding
        run: |
          pnpm docs:build
          pnpm check:branding
          pnpm check:links

      - name: Disable local commit hooks for generated sync commit
        run: rm -f .git/hooks/pre-commit

      - name: Open sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: sync/upstream
          delete-branch: true
          title: 'chore: sync upstream content'
          commit-message: 'chore: sync upstream content'
          body: |
            Automated upstream Markdown sync. The build and user-visible branding
            leak check passed; review the generated diff before merging.
